# Pre-push gate. This is the ONLY automated check before code reaches main,
# since this workflow uses no pull request review.
#
# Install:  lefthook install
# Verify:   deliberately break a test, attempt a push, confirm refusal.
#           A hook that silently does not run is worse than no hook.
#
# --no-verify is prohibited by project standards. If this blocks you, fix what
# it caught, or report that it is blocking and why.

pre-push:
  parallel: false
  # piped stops the sequence at the first failure. Without it the build and
  # test commands still run after the history check has already refused.
  piped: true
  commands:
    # Default-branch history integrity. Refuses a push that would delete the
    # default branch or rewrite its history. Runs FIRST so a history-destroying
    # push is stopped in milliseconds instead of after a full build and test
    # run. The leading 00 is what puts it first: lefthook orders commands by
    # priority, then by the leading number in the name, then alphabetically,
    # never by their position in this file.
    #
    # use_stdin: true is load bearing. git writes one ref-update record per
    # line to a pre-push hook's stdin, and without this lefthook does not
    # forward them. The guard fails closed when it receives nothing, so a
    # missing use_stdin blocks every push rather than silently disabling the
    # check. Verify the wiring with:
    #
    #   node .forge/branch-protection.js verify
    #
    # When the git host enforces this server side (tier 1), this stays wired
    # anyway: it costs nothing and it catches a bad push before it leaves the
    # machine.
    00_history:
      use_stdin: true
      run: node .forge/history-guard.js
      fail_text: "Refused: this push would delete or rewrite default-branch history."

    01_secrets:
      run: gitleaks detect --no-banner --redact --exit-code 1
      fail_text: "Secret detected. Do not commit it, do not bypass this. Rotate anything exposed."

    02_lint:
      run: <lint command>
      fail_text: "Lint failed."

    03_build:
      run: <build command>
      fail_text: "Build failed. Main must always build."

    04_test:
      run: <test command>
      fail_text: "Tests failed. Do not weaken tests to get past this."

    # Record set integrity, when the `records` capability is backfilled. A
    # dangling edge, a duplicate ID, or a fork in supersession makes the record
    # set untrustworthy, and an untrustworthy record set is worse than the
    # monolith it replaced: that at least contained the answer somewhere.
    #
    # --if-present makes both commands exit 0 on a project that has no
    # docs/records/, so a skipped or not-yet-backfilled capability leaves an
    # inert gate rather than a failing one.
    05_records:
      run: node .forge/forge-records-lint.js --if-present
      fail_text: "The record set has unresolved edges. Fix the records, do not bypass."

    06_views:
      run: node .forge/forge-views.js check --if-present
      fail_text: "docs/views/ is stale or hand-edited. Run: node .forge/forge-views.js render"

# Optional: keep commits cheap and fast, put only formatting here.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ext}"
      run: <formatter> {staged_files}
      stage_fixed: true
